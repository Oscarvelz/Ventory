<html lang="en" data-theme="night">

    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />

    <script>try{var t=localStorage.getItem("ventory-theme");var c={night:"#121410",day:"#f4f1ea",dusk:"#1c1612",pine:"#0e1a14",ink:"#0c0e12",bone:"#f6f0e6",harbor:"#101820",tron:"#02060c"};var s={night:["#121410","#f3f0e8","#6f947c"],day:["#f4f1ea","#1a1c17","#3f6b50"],dusk:["#1c1612","#f6efe6","#c4846a"],pine:["#0e1a14","#e7f0e4","#8fb89a"],ink:["#0c0e12","#e8eaee","#8aa0b8"],bone:["#f6f0e6","#241c16","#8a5a3b"],harbor:["#101820","#e6eef1","#6f9aa8"],tron:["#02060c","#e6faff","#00e5ff"]};var row=s[t]||s.night;var el=document.documentElement;el.style.setProperty("--sp-bg",row[0]);el.style.setProperty("--sp-ink",row[1]);el.style.setProperty("--sp-accent",row[2]);if(c[t]){el.dataset.theme=t;document.querySelector('meta[name="theme-color"]').setAttribute("content",c[t]);}}catch(e){}</script>
    <style>
      /* Launch splash (1.1.3): inline so it paints before any script loads — Brizna's architecture,
         Faro's choreography. The wordmark assembles letter by letter, then the light crosses the
         line under it (in Tron the amber light races back the other way, the header beams' rhythm).
         spa/splash.ts tells it when the first real screen is drawn; it fades over that screen. */
      #ventory-splash { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: var(--sp-bg, #121410); color: var(--sp-ink, #f3f0e8); transition: opacity 0.56s cubic-bezier(0.4, 0, 0.2, 1), transform 0.56s cubic-bezier(0.4, 0, 0.2, 1); }
      #ventory-splash.is-leaving { opacity: 0; transform: scale(1.035); pointer-events: none; }
      .vsp-lockup { display: grid; justify-items: center; gap: 16px; padding: 24px; }
      .vsp-word { display: flex; align-items: baseline; font-family: "Fraunces", Georgia, serif; font-weight: 560; font-size: clamp(2.75rem, 13vw, 3.75rem); line-height: 1; letter-spacing: -0.02em; }
      .vsp-mark { height: 0.72em; width: auto; margin-right: -0.12em; flex: none; color: var(--sp-ink, #f3f0e8); opacity: 0; transform: translateY(10px) scale(0.92); animation: vsp-in 0.6s 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
      .vsp-mark .vsp-jewel { fill: var(--sp-accent, #6f947c); }
      .vsp-word > span { display: inline-block; opacity: 0; transform: translateY(12px); filter: blur(6px); animation: vsp-letter 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
      @keyframes vsp-in { to { opacity: 1; transform: none; } }
      @keyframes vsp-letter { 60% { filter: blur(0); } to { opacity: 1; transform: none; filter: blur(0); } }
      .vsp-track { position: relative; width: 132px; height: 2px; border-radius: 2px; overflow: hidden; background: rgba(140, 140, 140, 0.28); }
      .vsp-beam { position: absolute; top: 0; left: 0; height: 100%; width: 38%; border-radius: 2px; opacity: 0; }
      .vsp-beam-a { background: linear-gradient(90deg, transparent, var(--sp-accent, #6f947c) 60%, #ffffff); animation: vsp-cross 1.25s 0.75s cubic-bezier(0.45, 0, 0.25, 1) forwards; }
      .vsp-beam-b { display: none; background: linear-gradient(270deg, transparent, #ffb21e 60%, #fff1c4); animation: vsp-cross-back 1.25s 1.3s cubic-bezier(0.45, 0, 0.25, 1) forwards; }
      html[data-theme="tron"] .vsp-beam-b { display: block; }
      @keyframes vsp-cross { 0% { transform: translateX(-110%); opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translateX(290%); opacity: 0; } }
      @keyframes vsp-cross-back { 0% { transform: translateX(290%); opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translateX(-110%); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        #ventory-splash *, #ventory-splash *::after { animation: none !important; }
        .vsp-mark, .vsp-word > span { opacity: 1; transform: none; filter: none; }
        .vsp-beam { display: none !important; }
        #ventory-splash.is-leaving { transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="ventory-splash" role="status" aria-label="Ventory">
      <div class="vsp-lockup">
        <div class="vsp-word" aria-hidden="true">
          <svg class="vsp-mark" viewBox="2 0 43.2 40"><path d="M3 1.5 L24 38.5 L45 1.5 L33.2 1.5 L24 22.8 L14.8 1.5 Z" fill="currentColor" /><rect class="vsp-jewel" x="19.3" y="3.4" width="9.4" height="8.2" rx="2.1" /></svg>
          <span style="animation-delay:420ms">e</span><span style="animation-delay:490ms">n</span><span style="animation-delay:560ms">t</span><span style="animation-delay:630ms">o</span><span style="animation-delay:700ms">r</span><span style="animation-delay:770ms">y</span>
        </div>
        <div class="vsp-track" aria-hidden="true"><i class="vsp-beam vsp-beam-a"></i><i class="vsp-beam vsp-beam-b"></i></div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
        var MIN = reduce ? 700 : 2350, MAX = 5000, t0 = Date.now(), gone = false;
        function hide() {
          if (gone) return; gone = true;
          var s = document.getElementById("ventory-splash");
          if (!s) return;
          s.classList.add("is-leaving");
          setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); window.__ventorySplashGone = true; }, 640);
        }
        function arm() {
          if (!window.__ventoryShellReady) return;
          var wait = MIN - (Date.now() - t0);
          if (wait <= 0) hide(); else setTimeout(hide, wait);
        }
        window.addEventListener("ventory:shell-ready", arm);
        var iv = setInterval(function () { arm(); if (gone) clearInterval(iv); }, 300);
        setTimeout(hide, MAX);
      })();
    </script>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
