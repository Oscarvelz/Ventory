# Publishes the privately signed Ventory for Android APK in this branch as GitHub release android-<VERSION> (asset Ventory.apk).
# This orphan branch only holds the latest signed APK (public by nature: it carries the certificate, never the key).
# It never touches `main` (GitHub Pages) or `source`.
name: Ventory for Android (publish signed APK)
on:
  push:
    branches: [android-signed]
    paths: ['Ventory.apk', 'VERSION']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        run: |
          echo "N=$(tr -dc '0-9' < VERSION)" >> "$GITHUB_ENV"
          sha256sum Ventory.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ env.N }}
          target_commitish: ${{ github.sha }}
          name: Ventory for Android ${{ env.N }}
          body_path: NOTES.md
          files: Ventory.apk
          make_latest: 'true'
