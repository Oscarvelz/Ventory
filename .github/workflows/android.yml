# Ventory for Android (WebView app, package com.oscarvelz.ventory). Runs only on the `source` branch when android/ changes
# (or by hand); it never touches `main` or GitHub Pages.
# Two jobs:
#  - build: no secrets. Compiles and uploads the unsigned APK artifact (ventory-unsigned-N), exactly like the old
#    no-secrets path. Builds never wait for anyone.
#  - release: needs build, and runs inside the GitHub environment `release`. That environment holds the signing
#    secrets VENTORY_KS_B64 (base64 of the PKCS12 keystore) and VENTORY_KS_PASS as ENVIRONMENT secrets and requires
#    Oscarvelz's review (admins cannot bypass), so every run waits for his approval before the key is touched.
#    After approval it signs the artifact with apksigner (alias ventory), verifies the certificate SHA-256 digest
#    (must start bf73c465 and end c5f646) and publishes release android-<run number> with Ventory.apk.
# If the environment secrets are missing, the release job ends without publishing and the fallback stands: the
# unsigned APK is signed privately with the same key and pushed to the orphan branch `android-signed`
# (Ventory.apk + VERSION=N), whose own workflow publishes release android-N.
# Every update must be signed with that one key or Android refuses it.
name: Ventory for Android
on:
  push:
    branches: [source]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ventory-android
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build (unsigned; signing happens in the release job)
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          VERSION_CODE: ${{ github.run_number }}
      - name: Collect
        run: |
          ls -la android/app/build/outputs/apk/release/
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk Ventory-unsigned.apk
      - name: Unsigned APK (input for the release job, or signed privately afterwards)
        uses: actions/upload-artifact@v4
        with:
          name: ventory-unsigned-${{ github.run_number }}
          path: Ventory-unsigned.apk
          retention-days: 14
  release:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: ventory-android-release
      cancel-in-progress: false
    steps:
      - name: Get the unsigned APK from the build job
        uses: actions/download-artifact@v4
        with:
          name: ventory-unsigned-${{ github.run_number }}
      - name: Is the key loaded in the environment?
        id: key
        env:
          KS_B64: ${{ secrets.VENTORY_KS_B64 }}
          KS_PASS: ${{ secrets.VENTORY_KS_PASS }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "have_key=1" >> "$GITHUB_OUTPUT"
          else
            echo "have_key=0" >> "$GITHUB_OUTPUT"
            echo "VENTORY_KS_B64 / VENTORY_KS_PASS are not set in the release environment; nothing will be signed or published."
          fi
      - name: Decode the keystore
        if: steps.key.outputs.have_key == '1'
        env:
          KS_B64: ${{ secrets.VENTORY_KS_B64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ventory.p12"
          chmod 600 "$RUNNER_TEMP/ventory.p12"
      - name: Sign with apksigner (alias ventory)
        if: steps.key.outputs.have_key == '1'
        env:
          VENTORY_KS_PASS: ${{ secrets.VENTORY_KS_PASS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          "$BT/zipalign" -c 4 Ventory-unsigned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ventory.p12" --ks-key-alias ventory \
            --ks-pass env:VENTORY_KS_PASS --key-pass env:VENTORY_KS_PASS \
            --out Ventory.apk Ventory-unsigned.apk
          ls -la Ventory.apk
      - name: Verify the signature is the Ventory key
        if: steps.key.outputs.have_key == '1'
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          CERTS=$("$BT/apksigner" verify --print-certs Ventory.apk)
          echo "$CERTS"
          DIGEST=$(echo "$CERTS" | grep -i "SHA-256 digest" | head -1 | sed 's/.*: //' | tr -d ' :')
          echo "certificate SHA-256: $DIGEST"
          case "$DIGEST" in
            bf73c465*c5f646) echo "Matches the Ventory signing key." ;;
            *) echo "ERROR: this is not the Ventory signing key; refusing to publish." ; exit 1 ;;
          esac
      - name: Release
        if: steps.key.outputs.have_key == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Ventory for Android ${{ github.run_number }}
          body: Install Ventory.apk on the phone or tablet (Android 11+). The app opens https://oscarvelz.github.io/Ventory/ with its own storage; sign in with your account to bring your floor.
          files: Ventory.apk
          make_latest: 'true'
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/ventory.p12"
